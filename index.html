<!DOCTYPE html>
<html lang="de" data-theme="handwerk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Widget — Live Demo on Three Example Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Chat Widget Demo — one widget, three businesses, two languages.
   The page pretends to be a real SMB website; the demo bar on
   top switches the whole site + widget persona + language live.
   ============================================================ */

:root {
  --font: 'Manrope', -apple-system, sans-serif;
  --font-display: 'Manrope', sans-serif;
  --demo-bg: #16161A;
  --demo-text: #B9B7C4;
  --radius: 10px;
}

/* ── themes ─────────────────────────────────────────────── */
[data-theme="handwerk"] {
  --accent: #1C4E80;
  --accent-dark: #143A61;
  --accent-soft: #E8EFF6;
  --bg: #F7F8F9;
  --panel: #FFFFFF;
  --ink: #1B222B;
  --ink2: #5A6472;
  --line: #E2E6EB;
  --hero-bg: linear-gradient(135deg, #143A61 0%, #1C4E80 100%);
  --hero-ink: #F2F6FB;
  --font-display: 'Manrope', sans-serif;
  --display-weight: 800;
  --display-spacing: -0.03em;
  --radius: 8px;
}
[data-theme="praxis"] {
  --accent: #0E7C6B;
  --accent-dark: #0A5F52;
  --accent-soft: #E6F4F1;
  --bg: #FBFDFC;
  --panel: #FFFFFF;
  --ink: #1E2A28;
  --ink2: #5E706C;
  --line: #E1EAE7;
  --hero-bg: linear-gradient(135deg, #E6F4F1 0%, #F3FAF8 100%);
  --hero-ink: #1E2A28;
  --font-display: 'Manrope', sans-serif;
  --display-weight: 700;
  --display-spacing: -0.02em;
  --radius: 14px;
}
[data-theme="ristorante"] {
  --accent: #8C3B2E;
  --accent-dark: #6E2D23;
  --accent-soft: #F6EAE2;
  --bg: #FBF6EE;
  --panel: #FFFDF8;
  --ink: #2E241C;
  --ink2: #6E6154;
  --line: #E9DFD0;
  --hero-bg: linear-gradient(135deg, #2E241C 0%, #4A382B 100%);
  --hero-ink: #F6EFE3;
  --font-display: 'Fraunces', serif;
  --display-weight: 700;
  --display-spacing: 0;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg); color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.35s;
}
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ── demo control bar ───────────────────────────────────── */
.demobar {
  position: sticky; top: 0; z-index: 500;
  background: var(--demo-bg); color: var(--demo-text);
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 8px 14px; padding: 9px 16px;
  font-size: 12.5px;
}
.demobar-label { font-weight: 600; letter-spacing: 0.02em; }
.demobar-tabs { display: flex; gap: 5px; }
.demo-tab {
  background: transparent; color: var(--demo-text);
  border: 1px solid #33333B; border-radius: 100px;
  padding: 5px 14px; font-size: 12px; font-weight: 600;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.demo-tab:hover { border-color: #55555F; color: #fff; }
.demo-tab.active { background: #fff; color: #16161A; border-color: #fff; }
.lang-tabs { display: flex; gap: 4px; }
.lang-tab {
  background: transparent; color: var(--demo-text);
  border: 1px solid #33333B; border-radius: 6px;
  padding: 5px 10px; font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.06em;
}
.lang-tab:hover { border-color: #55555F; color: #fff; }
.lang-tab.active { background: #fff; color: #16161A; border-color: #fff; }
.demobar a { color: var(--demo-text); text-decoration: underline; text-underline-offset: 2px; }
.demobar a:hover { color: #fff; }

/* ── fake business site ─────────────────────────────────── */
.site { max-width: 1020px; margin: 0 auto; padding: 0 24px 120px; }

.site-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0; gap: 16px;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
.logo-mark {
  width: 34px; height: 34px; border-radius: var(--radius);
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800;
}
.nav-links { display: flex; gap: 22px; font-size: 14px; font-weight: 600; color: var(--ink2); }
.nav-links span { cursor: default; }
.nav-links span:hover { color: var(--ink); }

.hero {
  background: var(--hero-bg); color: var(--hero-ink);
  border-radius: calc(var(--radius) * 2);
  padding: 64px 56px; margin-top: 8px;
  transition: background 0.35s;
}
.hero-kicker {
  display: inline-block; font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  opacity: 0.75; margin-bottom: 16px;
}
.hero h1 {
  font-family: var(--font-display);
  font-weight: var(--display-weight);
  letter-spacing: var(--display-spacing);
  font-size: clamp(1.9rem, 4.4vw, 3rem);
  line-height: 1.12; max-width: 560px; margin-bottom: 18px;
}
.hero p { font-size: 1.02rem; line-height: 1.7; max-width: 480px; opacity: 0.88; margin-bottom: 28px; }
.hero-cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--panel); color: var(--ink);
  border: none; border-radius: var(--radius);
  padding: 13px 24px; font-size: 15px; font-weight: 700;
  transition: transform 0.15s;
}
.hero-cta:hover { transform: translateY(-1px); }

.services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
.svc {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: calc(var(--radius) * 1.5); padding: 26px 24px;
}
.svc-icon {
  width: 42px; height: 42px; border-radius: var(--radius);
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; margin-bottom: 16px;
}
.svc h3 { font-size: 16px; font-weight: 700; margin-bottom: 7px; }
.svc p { font-size: 13.5px; color: var(--ink2); line-height: 1.65; }

.strip {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: calc(var(--radius) * 1.5);
  padding: 20px 26px; margin-top: 14px;
  font-size: 14px; color: var(--ink2);
}
.strip b { color: var(--ink); font-weight: 700; }
.strip .hint { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; }
.strip .hint svg { flex-shrink: 0; }

/* ── trigger button ─────────────────────────────────────── */
#trigger {
  position: fixed; bottom: 26px; right: 26px; z-index: 1000;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.35s;
}
#trigger:hover { transform: scale(1.07); }
#trigger svg { position: absolute; transition: opacity 0.18s, transform 0.22s; }
#trigger .ic-chat { opacity: 1; transform: scale(1) rotate(0); }
#trigger .ic-x    { opacity: 0; transform: scale(0.5) rotate(-90deg); }
#trigger.open .ic-chat { opacity: 0; transform: scale(0.5) rotate(90deg); }
#trigger.open .ic-x    { opacity: 1; transform: scale(1) rotate(0); }

.badge {
  position: absolute; top: -2px; right: -2px;
  min-width: 19px; height: 19px; border-radius: 100px;
  background: #D6402B; border: 2px solid var(--bg);
  font-size: 10px; font-weight: 800; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.2s, transform 0.2s;
}
.badge.gone { opacity: 0; transform: scale(0); }

/* ── widget window ──────────────────────────────────────── */
#win {
  position: fixed; bottom: 98px; right: 26px; z-index: 999;
  width: 372px; max-height: min(600px, calc(100svh - 130px));
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 28px 70px rgba(20, 20, 25, 0.25);
  transform-origin: bottom right;
  transform: scale(0.9) translateY(14px); opacity: 0; pointer-events: none;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
}
#win.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }

.wh {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 16px; background: var(--accent); color: #fff;
  transition: background 0.35s;
}
.wh-av {
  width: 38px; height: 38px; border-radius: 50%; position: relative;
  background: rgba(255,255,255,0.18);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.wh-dot {
  position: absolute; bottom: 0; right: 0;
  width: 10px; height: 10px; border-radius: 50%;
  background: #4ADE80; border: 2px solid var(--accent);
}
.wh-info { flex: 1; min-width: 0; }
.wh-info h3 { font-size: 14.5px; font-weight: 700; }
.wh-info p { font-size: 11.5px; opacity: 0.85; margin-top: 1px; }
.wh-min {
  background: rgba(255,255,255,0.12); border: none; color: #fff;
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.wh-min:hover { background: rgba(255,255,255,0.22); }

.wm {
  flex: 1; overflow-y: auto; padding: 18px 16px 10px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--bg); min-height: 260px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.msg { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
.msg.bot { align-self: flex-start; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg-bub {
  padding: 10px 14px; font-size: 13.5px; line-height: 1.55;
  border-radius: 14px; white-space: pre-line;
}
.msg.bot .msg-bub {
  background: var(--panel); border: 1px solid var(--line);
  border-bottom-left-radius: 4px; color: var(--ink);
}
.msg.user .msg-bub {
  background: var(--accent); color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-time { font-size: 10.5px; color: var(--ink2); opacity: 0.75; padding: 0 4px; }

.typing-bub {
  align-self: flex-start;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; border-bottom-left-radius: 4px;
  padding: 12px 15px; display: flex; gap: 4px;
}
.typing-bub span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ink2);
  animation: bounce 1.2s infinite;
}
.typing-bub span:nth-child(2) { animation-delay: 0.15s; }
.typing-bub span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

.wq { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 10px; background: var(--bg); }
.qr {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 100px; padding: 6px 13px;
  font-size: 12px; font-weight: 600; color: var(--accent);
  transition: border-color 0.15s, background 0.15s;
}
.qr:hover { border-color: var(--accent); background: var(--accent-soft); }

.wi { display: flex; gap: 8px; padding: 12px 14px; background: var(--panel); border-top: 1px solid var(--line); }
.wi-in {
  flex: 1; background: var(--bg); border: 1px solid var(--line);
  border-radius: 100px; padding: 10px 15px; font-size: 13.5px;
  color: var(--ink); outline: none; transition: border-color 0.15s;
}
.wi-in::placeholder { color: var(--ink2); opacity: 0.7; }
.wi-in:focus { border-color: var(--accent); }
.wi-send {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform 0.15s, opacity 0.15s, background 0.35s;
}
.wi-send:hover { transform: scale(1.08); }
.wi-send:disabled { opacity: 0.4; transform: none; cursor: not-allowed; }

.wfoot {
  text-align: center; font-size: 10px; color: var(--ink2);
  padding: 0 14px 9px; background: var(--panel);
}

/* ── responsive ─────────────────────────────────────────── */
@media (max-width: 760px) {
  .services { grid-template-columns: 1fr; }
  .hero { padding: 40px 28px; }
  .nav-links { display: none; }
}
@media (max-width: 540px) {
  .site { padding: 0 14px 130px; }
  #win {
    width: calc(100vw - 20px); right: 10px; bottom: 90px;
    max-height: calc(100svh - 108px); border-radius: 14px;
  }
  #trigger { bottom: 18px; right: 18px; }
}
</style>
</head>
<body>

<!-- demo control bar -->
<div class="demobar">
  <span class="demobar-label" id="barLabel"></span>
  <div class="demobar-tabs" id="tabs"></div>
  <div class="lang-tabs">
    <button class="lang-tab" data-lang="en" onclick="switchLang('en')">EN</button>
    <button class="lang-tab" data-lang="de" onclick="switchLang('de')">DE</button>
  </div>
  <a href="https://github.com/niki-deone/chatai" target="_blank" rel="noopener">GitHub</a>
</div>

<!-- fake business site (rendered by JS) -->
<div class="site">
  <nav class="site-nav">
    <div class="logo"><div class="logo-mark" id="logoMark"></div><span id="logoName"></span></div>
    <div class="nav-links" id="navLinks"></div>
  </nav>

  <header class="hero">
    <span class="hero-kicker" id="heroKicker"></span>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <button class="hero-cta" onclick="openWidget()" id="heroCta"></button>
  </header>

  <div class="services" id="services"></div>

  <div class="strip">
    <div id="stripInfo"></div>
    <div class="hint">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span id="stripHint"></span>
    </div>
  </div>
</div>

<!-- trigger -->
<button id="trigger" onclick="toggleWidget()" aria-label="Open chat">
  <div class="badge" id="badge">1</div>
  <svg class="ic-chat" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <svg class="ic-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<!-- widget -->
<div id="win" role="dialog" aria-label="Chat">
  <div class="wh">
    <div class="wh-av"><span id="botAv"></span><div class="wh-dot"></div></div>
    <div class="wh-info"><h3 id="botName"></h3><p id="botStatus"></p></div>
    <button class="wh-min" onclick="toggleWidget()" aria-label="Minimize">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <div class="wm" id="msgs"></div>
  <div class="wq" id="qrWrap"></div>
  <div class="wi">
    <input class="wi-in" id="inp" type="text" autocomplete="off" maxlength="300">
    <button class="wi-send" id="sendBtn" onclick="sendMsg()" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="wfoot" id="wFoot"></div>
</div>

<script>

/* ── state ─────────────────────────────────────────────── */
let currentTheme = 'handwerk';
let currentLang = 'en';
let open = false, busy = false;

const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString(currentLang === 'de' ? 'de-DE' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
const T = () => THEMES[currentTheme][currentLang];

/* ── render everything for current theme + lang ────────── */
function render() {
  const theme = THEMES[currentTheme];
  const t = T();
  const ui = UI[currentLang];

  document.documentElement.setAttribute('data-theme', currentTheme);
  document.documentElement.setAttribute('lang', currentLang);

  $('barLabel').textContent = ui.barLabel;
  $('tabs').innerHTML = Object.keys(THEMES).map(id =>
    `<button class="demo-tab${id === currentTheme ? ' active' : ''}" data-id="${id}" onclick="switchTheme('${id}')">${THEMES[id][currentLang].tab}</button>`).join('');
  document.querySelectorAll('.lang-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === currentLang));

  $('logoMark').textContent = theme.logoMark;
  $('logoName').textContent = t.logoName;
  $('navLinks').innerHTML = t.nav.map(n => `<span>${n}</span>`).join('');
  $('heroKicker').textContent = t.kicker;
  $('heroTitle').textContent = t.title;
  $('heroSub').textContent = t.sub;
  $('heroCta').textContent = t.cta;
  $('services').innerHTML = t.services.map(s =>
    `<div class="svc"><div class="svc-icon">${s.icon}</div><h3>${s.h}</h3><p>${s.p}</p></div>`).join('');
  $('stripInfo').innerHTML = t.strip;
  $('stripHint').textContent = ui.hint;

  $('botName').textContent = t.botName;
  $('botAv').textContent = theme.botAv;
  $('botStatus').textContent = ui.status;
  $('inp').placeholder = ui.placeholder;
  $('wFoot').textContent = ui.foot;
}

/* ── chat ──────────────────────────────────────────────── */
function resetChat() {
  const t = T();
  $('msgs').innerHTML = '';
  addMsg(t.greeting, 'bot');
  $('qrWrap').style.display = 'flex';
  $('qrWrap').innerHTML = t.quick.map(q =>
    `<button class="qr" onclick="sendQuick(this.textContent)">${q}</button>`).join('');
}

function addMsg(text, role) {
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const bub = document.createElement('div');
  bub.className = 'msg-bub';
  bub.textContent = text;
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now();
  d.append(bub, time);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

function showTyping() {
  const d = document.createElement('div');
  d.id = 'typer';
  d.innerHTML = '<div class="typing-bub"><span></span><span></span><span></span></div>';
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
const hideTyping = () => $('typer')?.remove();

function getReply(text) {
  const low = text.toLowerCase();
  const t = T();
  for (const r of t.resp) if (r.k.some(k => low.includes(k))) return r.r;
  return t.fallback;
}

function deliver(userText) {
  busy = true;
  $('sendBtn').disabled = true;
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMsg(getReply(userText), 'bot');
      busy = false;
      $('sendBtn').disabled = false;
      $('inp').focus();
    }, 800 + Math.random() * 600);
  }, 450 + Math.random() * 400);
}

function sendMsg() {
  if (busy) return;
  const t = $('inp').value.trim();
  if (!t) return;
  $('inp').value = '';
  $('qrWrap').style.display = 'none';
  addMsg(t, 'user');
  deliver(t);
}
function sendQuick(t) {
  if (busy) return;
  $('qrWrap').style.display = 'none';
  addMsg(t, 'user');
  deliver(t);
}

/* ── widget open/close ─────────────────────────────────── */
function toggleWidget() {
  open = !open;
  $('trigger').classList.toggle('open', open);
  $('win').classList.toggle('open', open);
  $('badge').classList.add('gone');
  if (open) setTimeout(() => $('inp').focus(), 320);
}
function openWidget() { if (!open) toggleWidget(); }

/* ── switching ─────────────────────────────────────────── */
function switchTheme(id) {
  if (id === currentTheme) return;
  currentTheme = id;
  render();
  resetChat();
}
function switchLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  render();
  resetChat();
}

/* ── init ──────────────────────────────────────────────── */
$('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) toggleWidget(); });

render();
resetChat();
</script>
